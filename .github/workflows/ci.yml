name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run build

  # Deploy the static build to GitHub Pages on every push to main
  # (and on manual dispatch). CI must pass first.
  pages:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # auto-enable Pages on the repo via GITHUB_TOKEN (pages: write)
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

      - id: deployment
        uses: actions/deploy-pages@v4

  # Required-check gate: always reports the combined CI + Pages result, so a
  # branch-protection rule on "deploy" does not keep blocking PRs where the
  # real pages deploy never runs (it is main-only by design).
  deploy:
    needs: [ci, pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report combined CI + Pages result
        run: |
          ci_result="${{ needs.ci.result }}"
          pages_result="${{ needs.pages.result }}"
          echo "ci: $ci_result"
          echo "pages: $pages_result"
          if [ "$ci_result" != "success" ]; then exit 1; fi
          if [ "$pages_result" != "success" ] && [ "$pages_result" != "skipped" ]; then exit 1; fi
